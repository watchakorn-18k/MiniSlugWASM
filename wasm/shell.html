<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Mini Slug (มินิ สลัก)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,700&family=Black+Ops+One&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        margin: 0;
        padding: 0;
        font-family: "Kanit", sans-serif;
      }
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #000000;
        overflow: hidden;
        position: fixed;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #000000;
        overflow: hidden;
      }
      canvas {
        display: block;
        /* Maximum size filling the entire window preserving 4:3 aspect ratio */
        width: min(100vw, calc(100vh * 4 / 3));
        height: min(100vh, calc(100vw * 3 / 4));
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        outline: none;
        border: none;
      }

      /* Loading Overlay */
      #loading-overlay {
        position: fixed;
        inset: 0;
        background-color: #090d16;
        z-index: 99;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #loading-overlay.hidden-overlay {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <!-- Loading Screen -->
    <div id="loading-overlay">
      <div class="text-center p-6 max-w-sm">
        <div class="relative w-16 h-16 mx-auto mb-4">
          <div class="w-16 h-16 rounded-full border-4 border-slate-700 border-t-red-500 animate-spin"></div>
        </div>
        <h2 class="text-xl font-bold text-white mb-2">กำลังโหลด Mini Slug...</h2>
        <p id="loading-status" class="text-sm text-slate-400 font-medium">กำลังเตรียมข้อมูลและระบบ WebAssembly</p>
      </div>
    </div>

    <!-- Pure Game Canvas Container -->
    <div id="game-container">
      <canvas
        id="canvas"
        oncontextmenu="event.preventDefault()"
        tabindex="-1"
      ></canvas>
    </div>

    <script>
      var Module = {
        canvas: (function () {
          var canvas = document.getElementById("canvas");
          canvas.addEventListener(
            "webglcontextlost",
            function (e) {
              console.error("WebGL context lost");
              e.preventDefault();
            },
            false
          );
          canvas.addEventListener("click", function () {
            canvas.focus();
          });
          return canvas;
        })(),
        onRuntimeInitialized: function () {
          console.log("WASM Runtime Initialized");
          var canvas = document.getElementById("canvas");
          if (canvas) {
            canvas.focus();
            canvas.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          }
          var overlay = document.getElementById("loading-overlay");
          if (overlay) {
            overlay.classList.add("hidden-overlay");
          }
        },
        setStatus: function (text) {
          if (!Module.setStatus.last)
            Module.setStatus.last = { time: Date.now(), text: "" };
          if (text === Module.setStatus.last.text) return;

          var statusEl = document.getElementById("loading-status");
          if (statusEl && text) {
            statusEl.textContent = text;
          }

          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return;
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;

          console.log("Status:", text);
        },
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          if (left === 0) {
            var overlay = document.getElementById("loading-overlay");
            if (overlay) {
              setTimeout(function() {
                overlay.classList.add("hidden-overlay");
              }, 200);
            }
          }
        },
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
